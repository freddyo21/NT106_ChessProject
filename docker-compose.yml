x-backend-common: &backend-common
  build:
    context: .
    dockerfile: Dockerfile.backend
  env_file:
    - backend/.env
  depends_on:
    - db
    - redis

x-backend-environment: &backend-environment
  NODE_ENV: development
  DATABASE_URL: postgres://postgres:mat_khau_moi_cua_ban@db:5432/chess_db
  REDIS_ENABLED: "true"
  REDIS_URL: redis://redis:6379

services:
  backend-3000:
    <<: *backend-common
    environment:
      <<: *backend-environment
      PORT: 3000
    expose:
      - "3000"

  backend-3001:
    <<: *backend-common
    environment:
      <<: *backend-environment
      PORT: 3001
    expose:
      - "3001"

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend-3000
      - backend-3001

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mat_khau_moi_cua_ban
      POSTGRES_DB: chess_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

volumes:
  postgres_data:
