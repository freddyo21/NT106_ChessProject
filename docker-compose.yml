services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    environment:
      - PORT=3000
      - NODE_ENV=development
      # Đổi 'mat_khau_moi_cua_ban' ở dòng dưới thành mật khẩu bạn muốn
      - DATABASE_URL=postgres://postgres:mat_khau_moi_cua_ban@db:5432/chess_db
    env_file:
      - backend/.env
    depends_on:
      - db
    # Dùng deploy.replicas để khởi tạo 3 phiên bản backend
    deploy:
      replicas: 3
    # Mở port ngẫu nhiên trên host cho mỗi container
    ports:
      - "3000"

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      # Đổi 'mat_khau_moi_cua_ban' ở dòng dưới thành mật khẩu bạn muốn (phải giống ở trên)
      POSTGRES_PASSWORD: mat_khau_moi_cua_ban
      POSTGRES_DB: chess_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

volumes:
  postgres_data:
