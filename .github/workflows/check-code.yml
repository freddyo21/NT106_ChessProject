name: CI Check
on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]

jobs:
  backend-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Thiết lập Node.js và Cache Root
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: "npm"
          cache-dependency-path: package-lock.json

      # Cài đặt toàn bộ Monorepo để đảm bảo nhận diện được folder shared
      - name: Cài đặt dependencies toàn hệ thống
        run: npm ci

      - name: Kiểm tra TypeScript Compile (Backend)
        run: npm run build --prefix backend --if-present

      - name: Kiểm tra Lint (Backend)
        run: npm run lint --prefix backend --if-present

      - name: Chạy Unit Test (Backend)
        run: npm test --prefix backend --if-present

  frontend-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Thiết lập Node.js và Cache Root
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Cài đặt dependencies toàn hệ thống
        run: npm ci

      - name: Kiểm tra TypeScript Compile (Frontend)
        run: npm run build --prefix frontend --if-present

      - name: Kiểm tra Lint (Frontend)
        run: npm run lint --prefix frontend --if-present

      - name: Chạy Unit Test (Frontend)
        run: npm test --prefix frontend --if-present